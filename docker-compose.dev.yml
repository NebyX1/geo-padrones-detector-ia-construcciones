services:
  postgres-postgis:
    networks: [internal, outbound]
    ports: ['127.0.0.1:5432:5432']
  redis:
    networks: [internal, outbound]
    ports: ['127.0.0.1:6379:6379']
  minio:
    networks: [internal, outbound]
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
  mailpit:
    image: axllent/mailpit:v1.27.8
    networks: [internal, outbound]
    ports: ['127.0.0.1:1125:1025', '127.0.0.1:8125:8025']
    restart: unless-stopped
  backend:
    environment:
      MAIL_SERVER: mailpit
      MAIL_PORT: '1025'
      FLASK_CONFIG: development
  worker:
    environment:
      MAIL_SERVER: mailpit
      MAIL_PORT: '1025'
      FLASK_CONFIG: development
