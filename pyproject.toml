[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["sample", ".venv"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "F401"]
"worker/run.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = ["integration: requires the local PostGIS service and a disposable database"]
